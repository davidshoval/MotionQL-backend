# Render Blueprint: New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
services:
  - type: web
    # Service name kept from before the MotionQL rename: renaming a Blueprint service makes Render create a new
    # service with a new URL and without its secret env vars.
    name: xquery-api
    runtime: node
    # Free: sleeps after 15 minutes without traffic, about a minute to wake; no Shell (use STAFF_EMAILS).
    plan: free
    region: frankfurt
    branch: main
    # NODE_ENV=production makes npm skip devDependencies (TypeScript, @types/node); include them to build, then drop them.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS in front of the service; trust it for client IPs (rate limits).
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_DB
        value: motionql
      # MongoDB Atlas connection string (allow Render's outbound IPs or 0.0.0.0/0 in Atlas Network Access).
      - key: MONGODB_URI
        sync: false
      # The website (xquery-website on Render, custom domain motionql.com) calls this API at https://api.motionql.com.
      - key: WEB_URL
        value: https://motionql.com
      # Comma-separated exact origins allowed to call the API with cookies.
      - key: WEB_ORIGINS
        value: https://motionql.com,https://www.motionql.com,https://xquery-website.onrender.com
      - key: COOKIE_DOMAIN
        value: ""
      # lax: motionql.com and api.motionql.com are the same site. Sign-in from xquery-website.onrender.com would need none.
      - key: COOKIE_SAME_SITE
        value: lax
      # The production Ed25519 private key (PEM), from the app's `npm run license -- keygen`.
      - key: LICENSE_SIGNING_KEY
        sync: false
      - key: LICENSE_SIGNING_KEY_PASSPHRASE
        sync: false
      # resend: motionql.com is verified in Resend (DNS records resend._domainkey and send.* at GoDaddy).
      - key: EMAIL_PROVIDER
        value: resend
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # MotionQL <hello@motionql.com> (the default with resend).
      - key: EMAIL_FROM
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      # Your own e-mail(s), comma-separated: they become staff once verified (the free plan has no Shell).
      - key: STAFF_EMAILS
        sync: false
      - key: RELEASES_REPO
        value: davidshoval/motionql-releases
