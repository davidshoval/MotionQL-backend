# Render Blueprint: New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for on first deploy.
services:
  - type: web
    name: xquery-api
    runtime: node
    # Free: sleeps after 15 minutes without traffic, about a minute to wake; no Shell (use STAFF_EMAILS).
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS in front of the service; trust it for client IPs (rate limits).
      - key: TRUST_PROXY
        value: "true"
      - key: MONGODB_DB
        value: xquery
      # MongoDB Atlas connection string (allow Render's outbound IPs or 0.0.0.0/0 in Atlas Network Access).
      - key: MONGODB_URI
        sync: false
      # Start: the website's Render service (xquery-website, frontend render.yaml).
      # Once xquery.io and api.xquery.io are custom domains: WEB_URL=https://xquery.io,
      # COOKIE_DOMAIN=.xquery.io, COOKIE_SAME_SITE=lax.
      - key: WEB_URL
        value: https://xquery-website.onrender.com
      # Comma-separated exact origins allowed to call the API with cookies.
      - key: WEB_ORIGINS
        value: https://xquery.io,https://xquery-website.onrender.com
      - key: COOKIE_DOMAIN
        value: ""
      # none while the site and API are separate *.onrender.com hosts; lax with custom domains.
      - key: COOKIE_SAME_SITE
        value: none
      # The production Ed25519 private key (PEM), from the app's `npm run license -- keygen`.
      - key: LICENSE_SIGNING_KEY
        sync: false
      - key: LICENSE_SIGNING_KEY_PASSPHRASE
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Xquery <hello@xquery.io>
      - key: TURNSTILE_SECRET
        sync: false
      # Your own e-mail(s), comma-separated: they become staff once verified (the free plan has no Shell).
      - key: STAFF_EMAILS
        sync: false
      - key: RELEASES_REPO
        value: davidshoval/Xquery.io-releases
